name: mirror-images

# The patch path into the air gap: mirrors images.txt to GHCR, builds oci
# archives, and publishes them as a release with checksums.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'      # weekly

permissions:
  contents: write
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Lowercase owner
        run: echo "DEST_PREFIX=ghcr.io/${OWNER,,}/opencti-airgap" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Mirror images and build bundle
        run: ./scripts/mirror-images.sh

      - name: Publish bundle as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="bundle-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" \
            out/bundle/*.oci.tar \
            out/bundle/sha256sums.txt \
            out/bundle/manifest.tsv \
            --title "$tag" \
            --notes "Offline image bundle built from images.txt at $(git rev-parse --short HEAD)"
