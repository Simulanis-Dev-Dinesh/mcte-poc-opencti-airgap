    # source: opencti/connector-cisa-known-exploited-vulnerabilities:latest
  connector-crowdsec:
    image: ${INTERNAL_REGISTRY:-registry.internal:5000}/opencti-connector-crowdsec:6.2.1
    # source: opencti/connector-crowdsec:6.2.1
  connector-cyberthreatexchange:
    image: ${INTERNAL_REGISTRY:-registry.internal:5000}/opencti-connector-dogesec-cyberthreatexchange:latest
    # source: opencti/connector-dogesec-cyberthreatexchange:latest
  connector-export-file-csv:
