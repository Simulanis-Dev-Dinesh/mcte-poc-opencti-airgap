# Air-gap override: point every service at the internal registry.
#
# Service names and image tags below are taken from the source stack
# (docker compose config --services + the running containers), so this file
# matches it 1:1 — including the services whose names differ from their image
# (connector-analysis runs connector-import-document, connector-cyberthreatexchange
# runs dogesec-cyberthreatexchange).
#
# Only needed for the REGISTRY route (make mirror -> load-into-registry.sh).
# If you carry xtm-images.tar and `docker load` it, do NOT use this file: the
# images already carry their original names.
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml \
#                  -f compose/docker-compose.override.yml up -d
services:
  connector-abuseipdb:
    image: ${INTERNAL_REGISTRY:-registry.internal:5000}/opencti-connector-abuseipdb:latest
    # source: opencti/connector-abuseipdb:latest
  connector-alienvault:
    image: ${INTERNAL_REGISTRY:-registry.internal:5000}/opencti-connector-alienvault:latest
    # source: opencti/connector-alienvault:latest
  connector-analysis:
    image: ${INTERNAL_REGISTRY:-registry.internal:5000}/opencti-connector-import-document:latest
    # source: opencti/connector-import-document:latest
  connector-cape:
